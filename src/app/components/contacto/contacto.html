<div class="contacto-header">
  <meta charset="UTF-8" />
  <h1 class="title">CONTÁCTANOS</h1>
  <p class="description">
    Déjanos tus datos y nos pondremos en contacto contigo lo antes posible.
  </p>
</div>
<section class="contacto-section">
  <div class="contacto-container">
    <div class="contacto-formulario">
      <form [formGroup]="formContacto" (ngSubmit)="enviarFormulario()">
        <div class="form-group">
          <input
            id="nombre"
            type="text"
            formControlName="nombre"
            placeholder="Nombre"
          />
        </div>

        <div class="form-group">
          <input
            id="apellido"
            type="text"
            formControlName="apellido"
            placeholder="Apellido"
          />
        </div>

        <div class="form-group">
          <input
            id="celular"
            type="tel"
            formControlName="celular"
            placeholder="Número de celular"
          />
        </div>

        <div class="form-group">
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="Correo"
          />
        </div>

        <div class="form-group">
          <textarea
            id="mensaje"
            rows="5"
            formControlName="mensaje"
            placeholder="Escribe tu mensaje aquí..."
          ></textarea>
        </div>

        <button type="submit" [disabled]="formContacto.invalid">Enviar</button>
      </form>
    </div>

    <div class="contacto-info">
      <div class="mapa-contenedor">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3762.9120766033634!2d-99.2041629248279!3d19.426667381858748!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d20206b2d791df%3A0x7f89db4a9d51906c!2sJuan%20Racine%20112%2C%20Polanco%2C%20Miguel%20Hidalgo%2C%2011510%20Ciudad%20de%20México%2C%20CDMX!5e0!3m2!1ses!2smx!4v1730656920831!5m2!1ses!2smx"
          width="100%"
          height="250"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <div class="info-contacto">
        <div class="info-item">
          <i class="fab fa-whatsapp"></i>
          <img
            src="assets/images/contacto/Icono_tel.svg"
            class="icono-contacto"
            alt="Teléfono"
          />
          <div>
            <h3>WHATSAPP</h3>
            <p>
              <a href="https://wa.me/525545306918" target="_blank">
                (+52) 55 4530 6918
              </a>
            </p>
          </div>
        </div>

        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <img
            src="assets/images/contacto/Icono_Email.svg"
            class="icono-contacto"
            alt="Correo"
          />
          <div>
            <h3>CORREO</h3>
            <p>info@bpracticert.com</p>
          </div>
        </div>

        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <img
            src="assets/images/contacto/Icono_Ubi.svg"
            class="icono-contacto"
            alt="Ubicación"
          />
          <div>
            <h3>DIRECCIÓN</h3>
            <p>
              Juan Racine 112 Piso 1, Col. Los Morales, Del. Miguel Hidalgo,
              CDMX C.P. 11510
            </p>
          </div>
        </div>

        <div class="info-item">
          <i class="fas fa-heart"></i>
        </div>
      </div>
    </div>
  </div>
</section>
